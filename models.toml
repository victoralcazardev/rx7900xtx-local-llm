# Model manifest. Single source of truth (see AGENTS.md).
#
# - GGUF paths are relative to `models_root` (set in local.toml, not tracked).
# - `sampling` only carries keys the vendor sets explicitly (AGENTS.md rule: "what the
#   vendor doesn't say, don't set"). The source of each value is in a comment.
# - `[defaults].flags` are the flags that ALREADY change the binary's default. Re-verified
#   against the engine's `--help` (see docs/measurements/). Re-verify with every new engine
#   build: a default can change between versions or backends. They apply to llama.cpp backends only:
#   the `maya` backend takes no command-line flags, just the profile's `env`, `chunk` and `kv`.
# - MTP profiles add `--spec-type draft-mtp --spec-draft-n-max N`; optional `spec_type` replaces
#   the drafter list (e.g. "draft-mtp,ngram-map-k4v").
# - Optional profile keys: `backend` (overrides the model's), `vision = false`
#   (skip loading the mmproj) and `vram_gib` (MEASURED peak of the process with a full
#   context; launch.py warns if that much free VRAM + 0.5 GiB isn't available). Engines:
#   hip (official), hip-kvmix (own build with K q8_0 + V q5_1/q4_1), hip-inkling (GodGMN
#   `inkling-rdna3` fork, Inkling-2-Mini only), maya (GodGMN `maya-inkling-mini` HIP port, not llama.cpp,
#   Inkling-2-Mini only; profile keys `chunk` and `env` feed its run config, kv is ["fp8","fp8"] or
#   ["f16","f16"]), vulkan. See docs/measurements/ and docs/ENGINES.md.
# - `default_alias`/`default_profile`: the launcher fallback when `scripts/launch.py` is called with
#   no alias — the setup last in use, not a recommendation; pick the alias per task
#   (docs/DECISIONS.md, 2026-11-23).
# - No recommended setup: the models sit side by side (2026-11-23, docs/DECISIONS.md). The fallback
#   is `inkling2-mini-unc-q8d` / `262k-maya`; the other models are the Qwen3.8-27B
#   `huihui-iq3s-mtp` / `262k-q8q51-mtp` and `inkling2-mini-unc` (both opt-in). The stock
#   `qwen38-iq3s-mtp` stays configured as the measured reference, not as a listed setup.
#   Add a new model/profile per docs/sop/new-model.md.

[defaults]
port = 8080
flags = ["-fa", "on", "-np", "1", "--ctx-checkpoints", "10", "-ngl", "all", "--metrics"]
default_alias = "inkling2-mini-unc-q8d"
default_profile = "315k-maya"

# ---------------------------------------------------------------------------
# Qwen3.8-27B GSQ-RCO IQ3_S-mtp, stock ISTA-DASLab quant (native NextN head): the measured reference,
# not a listed setup in README/STATUS, which list the abliterated `huihui-iq3s-mtp` of the same base.
# Sampling: official Qwen3.8-27B card (https://huggingface.co/Qwen/Qwen3.8-27B),
# also confirmed in local metadata (general.sampling.*) and quoted verbatim in the
# README of ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF (docs/models/qwen38-27b-quants.md).
[models.qwen38-iq3s-mtp]
gguf = "Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf"
backend = "hip"  # ROCm: 2-3.5x more tg than Vulkan on Linux (docs/measurements/engines.md)
mtp = true
mmproj = "Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp/mmproj-Qwen3.8-27B-BF16.gguf"

[models.qwen38-iq3s-mtp.sampling]
temp = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0

# The stock Qwen3.8-27B profile: every 240K, retrieval and coding-suite number in this repository was
# measured on it (owner doc docs/models/qwen38-27b.md); it was the launcher fallback from 2026-09-26
# until 2026-11-23. Measured 2026-09-26 (docs/measurements/): 68/68 exact retrieval
# matches pooled across configurations at 32K-240K (0 loops); only 8/8 used these exact profile
# flags at 240K. Retrieval is not a general coding-quality evaluation. At 240K fill:
# 24.4/26.9/18.6 tok/s essay/copy/code, pp 380, process
# VRAM 22,630 MiB, under a 272 W power cap (this card's driver minimum). `hip-kvmix` engine, KV
# q8_0/q5_1 (+27% KLD over q8/q8, doesn't show up in retrieval quality at 240K), MTP n=3, `-ub
# 256`. Launch the reference copy with `python3 scripts/launch.py qwen38-iq3s-mtp`. Opt-in.
[models.qwen38-iq3s-mtp.profiles."262k-q8q51-mtp"]
backend = "hip-kvmix"
context = 262144
kv = ["q8_0", "q5_1"]
spec_n_max = 3
# MTP + per-request n-gram map (2026-10-03, results/20261003-ngram-mtp-stacking/): +36..+63% on
# tasks that copy context (agent, editing; copy +62% at 240K), -0..-2% elsewhere, temperature-0
# output identical to MTP alone, same VRAM. `ngram-map-k4v` indexes the current slot sequence.
spec_type = "draft-mtp,ngram-map-k4v"
vision = false
vram_gib = 22.2
# Qwen3.8 card: reasoning_effort xhigh (template default) / medium / low. xhigh injects "think
# carefully, validate assumptions, consider alternatives" -> overthinking. medium = no extra
# instruction (balanced, per the card). low = "keep your thinking brief". `-ub 256` measured
# 2026-09-26 (docs/measurements/memory.md): less VRAM margin pressure than the `-ub 512` default,
# small pp cost. Both flags verified in --help.
# `--cache-ram 12288` (2026-10-03, results/20261003-cache-ram-side-request/): the 8192 MiB default
# evicts a ~180K main state (7.7 GiB host entry) as soon as another request's state is saved, so
# the main conversation re-prefilled for 412 s after one 20K side request; with 12288 it resumed
# from 179,749 cached tokens in 1.8 s. Costs up to ~4 GiB more host RAM (32 GiB host).
flags = ["-ub", "256", "--reasoning-effort", "medium", "--cache-ram", "12288"]

# ---------------------------------------------------------------------------
# Huihui Qwen3.8-27B abliterated GSQ-RCO IQ3_S-mtp (uncensored; the listed Qwen3.8-27B setup, opt-in).
# Card: https://huggingface.co/huihui-ai/Huihui-Qwen3.8-27B-abliterated-GGUF (no sampling stated; the base
# Qwen3.8-27B card's values, matching the GGUF's general.sampling.*). Same file size (12,120,016,416 bytes),
# quant method, architecture, NextN head and template as qwen38-iq3s-mtp, so it takes that setup's 262K
# profile unchanged and the harness's `local-262k` provider (results/20261105-huihui-iq3s-262k/).
[models.huihui-iq3s-mtp]
gguf = "Huihui-Qwen3.8-27B-abliterated-GSQ-RCO-IQ3_S-mtp/Huihui-Qwen3.8-27B-abliterated-GSQ-RCO-IQ3_S-mtp.gguf"
backend = "hip"
mtp = true

[models.huihui-iq3s-mtp.sampling]
temp = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0

[models.huihui-iq3s-mtp.profiles."262k-q8q51-mtp"]
backend = "hip-kvmix"
context = 262144
kv = ["q8_0", "q5_1"]
spec_n_max = 3
spec_type = "draft-mtp,ngram-map-k4v"
vision = false
vram_gib = 22.2
flags = ["-ub", "256", "--reasoning-effort", "medium", "--cache-ram", "12288"]

# ---------------------------------------------------------------------------
# Abiray Inkling-2-Mini-Uncensored IQ4_NL (uncensored; the untyped file behind the launcher fallback
# `inkling2-mini-unc-q8d`). GGUF of
# OpenUncensored/Inkling-2-Mini-Uncensored (rank-2 refusal edit on 20 attention output projections, experts untouched);
# replaced AtomicChat AD-Q4_K on 2026-11-22 (docs/DECISIONS.md). Experts all IQ4_NL, so the same file also loads in
# GodGMN's maya-ik2 HIP port. Cards: https://huggingface.co/thinkingmachines/Inkling-2-Mini (generation_config.json
# sets only temperature 1.0; re-read 2026-11-22) and https://huggingface.co/Abiray/Inkling-2-Mini-Uncensored-GGUF
# (recommends temp 1.0 + top-p 0.95; top-p is not the vendor's, so it stays unset like top_k; GGUF general.sampling
# is temp 1.0 only). Vendor warning: may loop in long reasoning; limit output tokens and agent turns.
# Engine: `hip-inkling` = GodGMN/llama.cpp `inkling-rdna3` cb0e46960. Upstream b12633 cannot hold 262K
# (12,765 MiB dense relative-bias compute buffer -> MoE offloaded, 4.5 tok/s); the fork computes the
# bias inside the FA kernel (docs/models/inkling-2-mini.md, results/20261122-inkling-uncensored-ad-q4k/).
[models.inkling2-mini-unc]
gguf = "Inkling-2-Mini-Uncensored-Abiray/Inkling-2-Mini-Uncensored-IQ4_NL.gguf"
backend = "hip-inkling"
mtp = false  # whether this GGUF carries the checkpoint's MTP head is unchecked
mmproj = "Inkling-2-Mini-Uncensored-Abiray/mmproj-Inkling-2-Mini-Uncensored-BF16.gguf"

[models.inkling2-mini-unc.sampling]
temp = 1.0
min_p = 0.0

# 262K, KV q8_0/q8_0 (2026-11-22, results/20261122-inkling-abiray-iq4nl/): 59.9 tok/s plain decode (code and
# prose, temperature 0), 21,305 MiB total GPU memory in use after load (KV and compute buffer are allocated at
# load; no full-context fill measured). q8_0/q8_0 chosen on the AtomicChat file over q8_0/q5_1 (faster, and the
# fork's own tests do not cover q8_0/q5_1). KV parity against f16 not measured on this fork (open). Text only.
[models.inkling2-mini-unc.profiles."262k-q8q8"]
context = 262144
kv = ["q8_0", "q8_0"]
vision = false
vram_gib = 20.8

# 262K on the maya-ik2 HIP port, same file (2026-11-22, results/20261122-inkling-maya-vs-fork/): E4M3 KV in
# 16-token global pages, --chunk 2048. At 272 W: decode 95 / 63.6 / 51.1 tok/s and prefill 1,894 / 1,292 after
# 512 / 128K / 262K tokens (the fork profile above: 57.6 / 44.5 / 37.8 and 882 / 599); GSM8K 95/96 vs. 93/96 on
# the same token IDs; refusals 0/8; tool calls and prefix reuse work. The rest of the env is the port's gfx1100
# preset (docs/inkling2-mini/ik2-mini-gfx1100.json in the checkout). ROCBLAS_TENSILE_LIBPATH: the port's venv
# rocBLAS has no gfx1100 kernels; the system ROCm library has them (docs/ENGINES.md). Text only. 20,765 MiB total
# GPU memory in use after load through launch.py (KV is allocated at load); smoke.py 96.5 tok/s.
[models.inkling2-mini-unc.profiles."262k-maya"]
backend = "maya"
context = 262144
kv = ["fp8", "fp8"]
chunk = 2048
env = { IK2_PAGED_KV = "1", ROCBLAS_TENSILE_LIBPATH = "/opt/rocm/lib/rocblas/library" }
vision = false
vram_gib = 20.3

# Launcher fallback since 2026-11-23 — the setup in use, not a recommendation (docs/DECISIONS.md):
# the same Abiray file with the output head and the 176 non-expert attention/conv matrices re-typed to Q8_0
# (2026-11-23, results/20261123-inkling-round/raw/retype_q8.py; experts and token_embd byte-identical, sha256
# 375eea1b...). maya-ik2 then takes its planar Q8 decode path, like the port author's ggml-org file. At 272 W, same
# bench: decode 106.1 / 98.2 / 90.0 / 68.9 tok/s at 512 / 8K / 32K / 128K vs. 95.7 / 88.2 / 82.3 / 64.2 (+7-11%),
# prefill +2-3%; 1.3 GiB more VRAM; GSM8K 187/192 vs. 188/192, refusals 0/8, tool call + prefix reuse OK
# (results/20261123-inkling-round/). Not llama.cpp-tested; the DSpark drafter still fails in rocBLAS on this build.
[models.inkling2-mini-unc-q8d]
gguf = "Inkling-2-Mini-Uncensored-Abiray-q8dense/Inkling-2-Mini-Uncensored-IQ4_NL-q8dense.gguf"
backend = "maya"
mtp = false

[models.inkling2-mini-unc-q8d.sampling]
temp = 1.0
min_p = 0.0

[models.inkling2-mini-unc-q8d.profiles."262k-maya"]
backend = "maya"
context = 262144
kv = ["fp8", "fp8"]
chunk = 2048
env = { IK2_PAGED_KV = "1", ROCBLAS_TENSILE_LIBPATH = "/opt/rocm/lib/rocblas/library" }
vision = false
vram_gib = 21.6

# ---------------------------------------------------------------------------
# Strata (docs/sop/strata.md): its own engine, clone and run config, not launched by launch.py.
# `python3 scripts/strata.py apply` writes each `[strata.<model>]` table into <strata_dir>/<config> (local.toml has
# strata_dir): keys replace the run config's, `env` is merged. `user_args` is Strata's list of hand-set engine
# options, applied by every setup run and start on top of setup's generated `args`.
# No Strata model is installed (2026-11-23; the SC117 run of 2026-11-22 read a shard from the HDD and was removed:
# results/20261122-strata-0219-sc117/; reinstall on the NVMe per docs/sop/strata.md). The Unsloth UD-IQ2_XS trial on v0.2.11 decoded at 2.6-8.2 tok/s (7.1-10.8
# with the squeeze arm), below the 15 tok/s floor, because its experts did not fit GPU + RAM (file tier 20.2 / 11.5 GiB,
# 24-51 GB read from the drive per request), and every Flash-Next set was then deleted
# (results/20261105-strata-unsloth-ud-iq2xs/). The clone and its engine stay for Qwen4; add a table back per
# docs/sop/strata.md when a model is installed again.
# 315,392 (2026-11-23, results/20261123-inkling-315k/): same file and env as 262k-maya; FP8 KV grows 16 KiB/token.
# Peak 22,874 MiB on the whole device (desktop included) of 24,560 during a 315,136-token cold prefill (~1.6 GiB
# free; 352,256 peaked at 23,577, ~1.0 GiB free, so it was not adopted); retrieval exact at 5% (prefill 271 s);
# 50%/95% pending. omp wires local-262k at contextWindow 315392 and compacts it at 75% (DECISIONS.md, 2026-11-23).
[models.inkling2-mini-unc-q8d.profiles."315k-maya"]
backend = "maya"
context = 315392
kv = ["fp8", "fp8"]
chunk = 2048
env = { IK2_PAGED_KV = "1", ROCBLAS_TENSILE_LIBPATH = "/opt/rocm/lib/rocblas/library" }
vision = false
vram_gib = 22.4
