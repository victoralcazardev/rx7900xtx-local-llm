# Model manifest. Single source of truth (see AGENTS.md).
#
# - GGUF paths are relative to `models_root` (set in local.toml, not tracked).
# - `sampling` only carries keys the vendor sets explicitly (AGENTS.md rule: "what the
#   vendor doesn't say, don't set"). The source of each value is in a comment.
# - `[defaults].flags` are the flags that ALREADY change the binary's default. Re-verified
#   against the engine's `--help` (see docs/measurements/). Re-verify with every new engine
#   build: a default can change between versions or backends.
# - MTP profiles add `--spec-type draft-mtp --spec-draft-n-max N`; optional `spec_type` replaces
#   the drafter list (e.g. "draft-mtp,ngram-map-k4v").
# - Optional profile keys: `backend` (overrides the model's), `vision = false`
#   (skip loading the mmproj) and `vram_gib` (MEASURED peak of the process with a full
#   context; launch.py warns if that much free VRAM + 0.5 GiB isn't available). Engines:
#   hip (official), hip-kvmix (own build with K q8_0 + V q5_1/q4_1), vulkan. See
#   docs/measurements/.
# - `default_alias`/`default_profile`: what `scripts/launch.py` loads when called with no
#   alias (see docs/STATUS.md for why this is the current best configuration).
# - One best default (2026-09-26, docs/DECISIONS.md), plus opt-in models the user asked for
#   (2026-11-05: huihui-q4km-mtp). Add a new model/profile per docs/sop/new-model.md.

[defaults]
port = 8080
flags = ["-fa", "on", "-np", "1", "--ctx-checkpoints", "4", "-ngl", "all", "--metrics"]
default_alias = "qwen38-iq3s-mtp"
default_profile = "262k-q8q51-mtp"

# ---------------------------------------------------------------------------
# Qwen3.8-27B GSQ-RCO IQ3_S-mtp (native NextN head).
# Sampling: official Qwen3.8-27B card (https://huggingface.co/Qwen/Qwen3.8-27B),
# also confirmed in local metadata (general.sampling.*) and quoted verbatim in the
# README of ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF (docs/models/qwen38-27b-quants.md).
[models.qwen38-iq3s-mtp]
gguf = "Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf"
backend = "hip"  # ROCm: 2-3.5x more tg than Vulkan on Linux (docs/measurements/engines.md)
mtp = true
mmproj = "Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp/mmproj-Qwen3.8-27B-BF16.gguf"

[models.qwen38-iq3s-mtp.sampling]
temp = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0

# Recommended daily long-context default (2026-09-26, docs/measurements/): 68/68 exact retrieval
# matches pooled across configurations at 32K-240K (0 loops); only 8/8 used these exact profile
# flags at 240K. Retrieval is not a general coding-quality evaluation. At 240K fill:
# 24.4/26.9/18.6 tok/s essay/copy/code, pp 380, process
# VRAM 22,630 MiB, under a 272 W power cap (this card's driver minimum). `hip-kvmix` engine, KV
# q8_0/q5_1 (+27% KLD over q8/q8, doesn't show up in retrieval quality at 240K), MTP n=3, `-ub
# 256`. This is `scripts/launch.py`'s default (see `[defaults]` above) when no alias is given.
[models.qwen38-iq3s-mtp.profiles."262k-q8q51-mtp"]
backend = "hip-kvmix"
context = 262144
kv = ["q8_0", "q5_1"]
spec_n_max = 3
# MTP + per-request n-gram map (2026-10-03, results/20261003-ngram-mtp-stacking/): +36..+63% on
# tasks that copy context (agent, editing; copy +62% at 240K), -0..-2% elsewhere, temperature-0
# output identical to MTP alone, same VRAM. `ngram-map-k4v` indexes the current slot sequence.
spec_type = "draft-mtp,ngram-map-k4v"
vision = false
vram_gib = 22.2
# Qwen3.8 card: reasoning_effort xhigh (template default) / medium / low. xhigh injects "think
# carefully, validate assumptions, consider alternatives" -> overthinking. medium = no extra
# instruction (balanced, per the card). low = "keep your thinking brief". `-ub 256` measured
# 2026-09-26 (docs/measurements/memory.md): less VRAM margin pressure than the `-ub 512` default,
# small pp cost. Both flags verified in --help.
# `--cache-ram 12288` (2026-10-03, results/20261003-cache-ram-side-request/): the 8192 MiB default
# evicts a ~180K main state (7.7 GiB host entry) as soon as another request's state is saved, so
# the main conversation re-prefilled for 412 s after one 20K side request; with 12288 it resumed
# from 179,749 cached tokens in 1.8 s. Costs up to ~4 GiB more host RAM (32 GiB host).
flags = ["-ub", "256", "--reasoning-effort", "medium", "--cache-ram", "12288"]

# ---------------------------------------------------------------------------
# Huihui Qwen3.8-27B abliterated GSQ-RCO IQ3_S-mtp (uncensored; opt-in, not the default).
# Card: https://huggingface.co/huihui-ai/Huihui-Qwen3.8-27B-abliterated-GGUF (no sampling stated; the base
# Qwen3.8-27B card's values, matching the GGUF's general.sampling.*). Same file size (12,120,016,416 bytes),
# quant method, architecture, NextN head and template as qwen38-iq3s-mtp, so it takes the default's 262K
# profile unchanged and the harness's `local-262k` provider (results/20261105-huihui-iq3s-262k/).
[models.huihui-iq3s-mtp]
gguf = "Huihui-Qwen3.8-27B-abliterated-GSQ-RCO-IQ3_S-mtp/Huihui-Qwen3.8-27B-abliterated-GSQ-RCO-IQ3_S-mtp.gguf"
backend = "hip"
mtp = true

[models.huihui-iq3s-mtp.sampling]
temp = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0

[models.huihui-iq3s-mtp.profiles."262k-q8q51-mtp"]
backend = "hip-kvmix"
context = 262144
kv = ["q8_0", "q5_1"]
spec_n_max = 3
spec_type = "draft-mtp,ngram-map-k4v"
vision = false
vram_gib = 22.2
flags = ["-ub", "256", "--reasoning-effort", "medium", "--cache-ram", "12288"]

# ---------------------------------------------------------------------------
# Huihui Qwen3.8-27B abliterated UD-DW-Q4_K_M (uncensored; opt-in, not the default).
# Card: https://huggingface.co/huihui-ai/Huihui-Qwen3.8-27B-abliterated-GGUF ("UD-DW series come from
# unsloth/Qwen3.8-27B-GGUF. Only layers 22 to 52 (0-based indexing) have been ablated"; "MTP and visual
# has not been modified"). Same `qwen35` architecture, NextN head and template as the model above, so the
# same engine and flags apply. The card sets no sampling: these are the base Qwen3.8-27B card's values,
# which match the GGUF's general.sampling.* (temp 1.0, top_p 0.95, top_k 20). No mmproj downloaded.
[models.huihui-q4km-mtp]
gguf = "Huihui-Qwen3.8-27B-abliterated-UD-DW-Q4_K_M/Huihui-Qwen3.8-27B-abliterated-UD-DW-Q4_K_M.gguf"
backend = "hip-kvmix"
mtp = true

[models.huihui-q4km-mtp.sampling]
temp = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0

# 128K (2026-11-05, results/20261105-huihui-q4km-context/): the Q4_K_M weights take 15,092 MiB on the GPU
# (+~3 GiB over the IQ3_S), so 262K does not fit. KV q8_0/q5_1 + MTP KV + prefill buffers cost ~33.8 KB per
# context token. 196,608 evicted VRAM during prefill and crashed the desktop (Brave killed, KWin stalled);
# 147,456 runs but leaves ~2.3 GB for the desktop; 131,072 peaks at 22.84 GB and leaves ~2.9 GB. Production
# flags of the profile above. Below the harness's ~183K compaction threshold (see the results README).
[models.huihui-q4km-mtp.profiles."128k-q8q51-mtp"]
context = 131072
kv = ["q8_0", "q5_1"]
spec_n_max = 3
spec_type = "draft-mtp,ngram-map-k4v"
vram_gib = 21.3
flags = ["-ub", "256", "--reasoning-effort", "medium", "--cache-ram", "12288"]

# ---------------------------------------------------------------------------
# Strata (docs/sop/strata.md): its own engine, clone and run config, not launched by launch.py.
# `python3 scripts/strata.py apply` writes each `[strata.<model>]` table into <strata_dir>/<config> (local.toml has
# strata_dir): keys replace the run config's, `env` is merged. `user_args` is Strata's list of hand-set engine
# options, applied by every setup run and start on top of setup's generated `args`.
# No Strata model is installed (2026-11-05). The Unsloth UD-IQ2_XS trial on v0.2.11 decoded at 2.6-8.2 tok/s (7.1-10.8
# with the squeeze arm), below the 15 tok/s floor, because its experts did not fit GPU + RAM (file tier 20.2 / 11.5 GiB,
# 24-51 GB read from the drive per request), and every Flash-Next set was then deleted
# (results/20261105-strata-unsloth-ud-iq2xs/). The clone and its engine stay for Qwen4; add a table back per
# docs/sop/strata.md when a model is installed again.

