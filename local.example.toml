# Copy this to local.toml (git-ignored) and adjust the paths for this machine.
# models_root: folder that contains the .gguf files referenced in models.toml.
models_root = "/path/to/Models"

# Optional: the Strata clone (docs/sop/strata.md), for scripts/strata.py.
# strata_dir = "/path/to/Strata"

# One engine per backend. Empty ("") = not installed on this machine yet.
# Never a binary with both Vulkan and HIP compiled in (llama.cpp issue #23199,
# see docs/measurements/engines.md).
[engines]
vulkan = ""
hip = ""
hip-kvmix = ""
hip-inkling = ""  # optional: GodGMN inkling-rdna3 fork, Inkling-2-Mini only (docs/ENGINES.md)
maya = ""  # optional: GodGMN maya-inkling-mini hip-port checkout with build-ik2/ and .venv/, Inkling-2-Mini only (docs/ENGINES.md)

# Optional: `scripts/build_engine.py` (docs/sop/update-engine.md "Build a new engine"). One
# folder per checkout and per build, so nothing is ever overwritten.
# [build]
# src_root = "/path/to/src"          # git checkouts, <src_root>/llama.cpp-<ref>; default: <engines_root>/src
# engines_root = "/path/to/engines"  # built engines; default: the parent folder of engines.hip-kvmix
# hip_runtime_lib = ""               # symlinked into each new engine as libamdhip64.so.7
#                                    # (CachyOS ROCm 10.1 workaround, docs/sop/install.md)

# Optional: verify this launcher is wired into your own coding-agent harness. Off unless
# harness.enabled = true. Each target's config file is checked for EXACTLY one provider,
# local-262k, pointing at :8080 with the right contextWindow -- see scripts/check-sync.py
# and AGENTS.md. Optional per target: `context_window = <N>` (at most 262144) advertises a
# smaller window for local-262k, which moves that harness's auto-compaction trigger for the
# local model only (omp: thresholdPercent x window; pi/Gentle Shell: window - reserveTokens).
# [harness]
# enabled = true
# targets = [
#   { name = "example", path = "~/.example/agent/models.json", format = "json",
#     root = [], base_url_key = "baseUrl" },
# ]
